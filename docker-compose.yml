services:
  taghuntdev:
    build: .
    container_name: taghuntdev
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      DATA_DIR: /app/data
      # Number of reverse proxy hops in front of this container (default 1).
      TRUST_PROXY_HOPS: ${TAGHUNT_TRUST_PROXY_HOPS:-1}
    volumes:
      - taghuntdev-data:/app/data

volumes:
  taghuntdev-data:
